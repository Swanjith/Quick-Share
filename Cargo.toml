[package]
name = "fastshare"
version = "1.0.0"
edition = "2021"
description = "Ultra-fast file sharing between devices on the same network"
license = "MIT"
authors = ["Samhith Enganti <enganti.samhith@gmail.com>"]
readme = "README.md"
repository = "https://github.com/SammmE/fastshare"
homepage = "https://github.com/SammmE/fastshare"
keywords = [
    "file-transfer",
    "network",
    "cli",
    "cross-platform",
    "p2p",
]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
local-ip-address = "0.6"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.0", features = ["v4"] }
